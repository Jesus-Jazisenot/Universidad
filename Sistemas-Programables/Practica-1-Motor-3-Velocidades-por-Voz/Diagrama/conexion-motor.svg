<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Conexion del motorreductor con L298N y Arduino UNO R4 WiFi</title>

  <rect x="0" y="0" width="680" height="420" fill="#FAF9F5"/>

  <line x1="180" y1="190" x2="290" y2="190" stroke="#E8834A" stroke-width="3"/>
  <line x1="180" y1="215" x2="290" y2="215" stroke="#E0C64A" stroke-width="3"/>
  <line x1="180" y1="240" x2="290" y2="240" stroke="#6BA84F" stroke-width="3"/>
  <line x1="180" y1="275" x2="290" y2="275" stroke="#333331" stroke-width="3"/>

  <line x1="450" y1="145" x2="530" y2="145" stroke="#C8483A" stroke-width="3"/>
  <line x1="450" y1="170" x2="530" y2="170" stroke="#333331" stroke-width="3"/>

  <line x1="450" y1="310" x2="530" y2="310" stroke="#C8483A" stroke-width="3"/>
  <line x1="450" y1="340" x2="530" y2="340" stroke="#333331" stroke-width="3"/>

  <rect x="40" y="110" width="140" height="200" rx="8" fill="#00979D"/>
  <text x="110" y="138" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Arduino</text>
  <text x="110" y="156" font-size="12" fill="#CDEBEC" text-anchor="middle">UNO R4 WiFi</text>
  <text x="172" y="194" font-size="12" fill="#FFFFFF" text-anchor="end">9  ~PWM</text>
  <text x="172" y="219" font-size="12" fill="#FFFFFF" text-anchor="end">8</text>
  <text x="172" y="244" font-size="12" fill="#FFFFFF" text-anchor="end">7</text>
  <text x="172" y="279" font-size="12" fill="#FFFFFF" text-anchor="end">GND</text>

  <rect x="290" y="90" width="160" height="290" rx="6" fill="#1F4D6B"/>
  <text x="370" y="116" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">L298N</text>
  <text x="300" y="194" font-size="12" fill="#FFFFFF">ENA</text>
  <text x="300" y="219" font-size="12" fill="#FFFFFF">IN1</text>
  <text x="300" y="244" font-size="12" fill="#FFFFFF">IN2</text>
  <text x="300" y="279" font-size="12" fill="#FFFFFF">GND</text>
  <text x="440" y="149" font-size="12" fill="#FFFFFF" text-anchor="end">OUT1</text>
  <text x="440" y="174" font-size="12" fill="#FFFFFF" text-anchor="end">OUT2</text>
  <text x="440" y="314" font-size="12" fill="#FFFFFF" text-anchor="end">12V</text>
  <text x="440" y="344" font-size="12" fill="#FFFFFF" text-anchor="end">GND</text>

  <rect x="530" y="118" width="110" height="78" rx="6" fill="#6E6E6C"/>
  <text x="585" y="150" font-size="12" fill="#FFFFFF" text-anchor="middle">Motorreductor</text>
  <text x="585" y="172" font-size="11" fill="#D6D5D2" text-anchor="middle">(da igual el orden)</text>

  <rect x="530" y="288" width="110" height="80" rx="6" fill="#3A3A38"/>
  <text x="585" y="316" font-size="12" fill="#FFFFFF" text-anchor="middle">LiPo 3S</text>
  <text x="585" y="338" font-size="11" fill="#D6D5D2" text-anchor="middle">11.1 V</text>
  <text x="524" y="306" font-size="14" fill="#C8483A" text-anchor="end">+</text>
  <text x="524" y="344" font-size="14" fill="#8F8E8B" text-anchor="end">-</text>

  <text x="40" y="400" font-size="12" fill="#8B4A2B">Quitar el jumper de ENA. El GND del Arduino y el de la bateria van unidos.</text>
</svg>
